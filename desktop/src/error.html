<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Epichat — Serveur indisponible</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        max-width: 520px;
        padding: 48px 40px;
        text-align: center;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 16px;
        font-weight: 600;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #94a3b8;
        margin-bottom: 32px;
      }
      code {
        background: #1e293b;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 13px;
        color: #a5b4fc;
      }
      button {
        background: #6366f1;
        color: white;
        border: none;
        padding: 12px 32px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #4f46e5;
      }
      button:active {
        background: #4338ca;
      }
      .hint {
        margin-top: 24px;
        font-size: 13px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Serveur Epichat indisponible</h1>
      <p>
        Impossible de joindre <code>http://localhost:3000</code>.<br />
        Vérifie que Docker est bien lancé avec
        <code>docker compose up</code>.
      </p>
      <button id="retry">Réessayer</button>
      <p class="hint">Le bouton retente la connexion au serveur.</p>
    </div>

    <script>
      document.getElementById("retry").addEventListener("click", () => {
        window.location.href = "http://localhost:3000";
      });
    </script>
  </body>
</html>
