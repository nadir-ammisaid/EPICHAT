<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Epichat — Serveur indisponible</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #f3f7fb;
        color: #171717;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        max-width: 520px;
        padding: 48px 40px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #d0d0e0;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(4, 99, 202, 0.08);
      }
      h1 {
        font-size: 28px;
        margin-bottom: 16px;
        font-weight: 600;
        color: #171717;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #64748b;
        margin-bottom: 32px;
      }
      code {
        background: #f3f7fb;
        border: 1px solid #d0d0e0;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 13px;
        color: #0463ca;
        font-family: ui-monospace, "Cascadia Code", "Source Code Pro", monospace;
      }
      button {
        background: #0463ca;
        color: white;
        border: none;
        padding: 12px 32px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #0487e2;
      }
      button:active {
        background: #09b1ec;
      }
      .hint {
        margin-top: 24px;
        font-size: 13px;
        color: #77a3d2;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Serveur Epichat indisponible</h1>
      <p>
        Impossible de joindre <code>http://localhost:3000</code>.<br />
        Vérifie que Docker est bien lancé avec
        <code>docker compose up</code>.
      </p>
      <button id="retry">Réessayer</button>
      <p class="hint">Le bouton retente la connexion au serveur.</p>
    </div>

    <script>
      document.getElementById("retry").addEventListener("click", () => {
        window.location.href = "http://localhost:3000";
      });
    </script>
  </body>
</html>
