appId: com.epichat.desktop
productName: Epichat
copyright: Copyright © 2026 Epichat

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

asar: true

linux:
  target:
    - deb
  category: Network
  synopsis: Epichat desktop chat application

win:
  target:
    - target: nsis
      arch:
        - x64

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.social-networking

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
